# Mouse on: the wheel enters copy-mode (tmux's default WheelUpPane runs
# `copy-mode -e`, which exits again at the bottom), so scrollback needs no
# prefix-[ and no Escape. Fn-drag in Terminal.app still selects natively.
set -g mouse on
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# Terminal.app has no OSC 52, so set-clipboard alone never reaches the system
# clipboard. copy-command gives every default copy binding somewhere local to
# pipe to, which makes drag / double-click / triple-click copy on release.
set -s set-clipboard on
if-shell 'command -v pbcopy'   'set -s copy-command "pbcopy"'
if-shell 'command -v wl-copy'  'set -s copy-command "wl-copy"'
if-shell 'command -v xclip'    'set -s copy-command "xclip -selection clipboard"'

# Copying normally cancels copy-mode, which snaps back to the live bottom. Only
# do that when already at the bottom; while scrolled up, keep the position.
bind -T copy-mode    MouseDragEnd1Pane if -F '#{==:#{scroll_position},0}' 'send -X copy-pipe-and-cancel' 'send -X copy-pipe-no-clear'
bind -T copy-mode-vi MouseDragEnd1Pane if -F '#{==:#{scroll_position},0}' 'send -X copy-pipe-and-cancel' 'send -X copy-pipe-no-clear'
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; if -F '#{==:#{scroll_position},0}' 'send -X copy-pipe-and-cancel' 'send -X copy-pipe-no-clear'
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; if -F '#{==:#{scroll_position},0}' 'send -X copy-pipe-and-cancel' 'send -X copy-pipe-no-clear'
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; if -F '#{==:#{scroll_position},0}' 'send -X copy-pipe-and-cancel' 'send -X copy-pipe-no-clear'
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; if -F '#{==:#{scroll_position},0}' 'send -X copy-pipe-and-cancel' 'send -X copy-pipe-no-clear'

# Terminal tab shows the tmux session name, which ct sets to <repo>/<branch>,
# so the right session is findable without entering it.
set -g set-titles on
set -g set-titles-string "#S"
